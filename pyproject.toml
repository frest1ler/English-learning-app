[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "english-learning-app"
version = "0.4.0"
description = "Local adaptive English learning desktop application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.3,<5",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "PyInstaller>=6.12,<7",
]

[project.scripts]
english-learning-app = "english_learning.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
