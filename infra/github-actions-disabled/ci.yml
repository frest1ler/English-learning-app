name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          ENGLISH_LEARNING_SKIP_WELCOME: "1"
          ENGLISH_LEARNING_SMOKE_TEST: "1"
        run: python main.py
      - name: GUI smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          ENGLISH_LEARNING_SKIP_WELCOME: "1"
          ENGLISH_LEARNING_SMOKE_TEST: "1"
        run: python main.py
